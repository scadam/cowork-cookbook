<!DOCTYPE html>
<html lang="en-GB" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cowork Cookbook: pictures</title>
<style>
:root{--bg:#f4f4f4;--surface:#ffffff;--text:#111111;--muted:#5d5d5d;--border:#e1e1e1}
@media (prefers-color-scheme: dark){:root{--bg:#0f0f10;--surface:#19191b;--text:#ededed;--muted:#a3a3a3;--border:#323236}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.5}
main{max-inline-size:1000px;margin-inline:auto;padding:28px 20px 60px}
h1{margin:0 0 6px;font-size:1.6rem}
p.lede{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
figure{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
figure img{display:block;inline-size:100%;border-radius:10px}
figcaption{font-size:.9rem;color:var(--muted);margin-block-start:8px}
figcaption b{color:var(--text)}
code{font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>Cowork Cookbook: pictures</h1>
  <p class="lede">Pictures that Launchpad for Cowork shows in its cards. All people, organisations and figures shown are invented.</p>
  <div class="grid">
    <figure>
      <img src="assets/v2/launchpad-for-cowork-icon.png" alt="Launchpad for Cowork" loading="lazy">
      <figcaption><b>Launchpad for Cowork</b><br>The plugin icon.<br><code>assets/v2/launchpad-for-cowork-icon.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v2/launchpad-welcome-banner-mono.png" alt="Welcome banner" loading="lazy">
      <figcaption><b>Welcome banner</b><br>At the top of the welcome card.<br><code>assets/v2/launchpad-welcome-banner-mono.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v2/launchpad-picture-menu-mono.png" alt="Picture menu" loading="lazy">
      <figcaption><b>Picture menu</b><br>What Launchpad could make for you.<br><code>assets/v2/launchpad-picture-menu-mono.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v1/launchpad-variance-commentary-example.png" alt="Example: variance commentary" loading="lazy">
      <figcaption><b>Example: variance commentary</b><br>Every line carries an evidence status.<br><code>assets/v1/launchpad-variance-commentary-example.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v1/launchpad-budget-round-app-mock.png" alt="Example: budget round app" loading="lazy">
      <figcaption><b>Example: budget round app</b><br>Replaces a shared tracker and status emails.<br><code>assets/v1/launchpad-budget-round-app-mock.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v2/launchpad-mbr-brief-example.png" alt="Example: MBR brief" loading="lazy">
      <figcaption><b>Example: MBR brief</b><br>Ready the evening before the monthly business review.<br><code>assets/v2/launchpad-mbr-brief-example.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v2/launchpad-committee-paper-example.png" alt="Example: committee paper" loading="lazy">
      <figcaption><b>Example: committee paper</b><br>A front sheet and a coaching review.<br><code>assets/v2/launchpad-committee-paper-example.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v1/launchpad-picture-menu.png" alt="Picture menu (first version)" loading="lazy">
      <figcaption><b>Picture menu (first version)</b><br>Kept so that older links still work.<br><code>assets/v1/launchpad-picture-menu.png</code></figcaption>
    </figure>
    <figure>
      <img src="assets/v1/launchpad-welcome-banner.png" alt="Welcome banner (first version)" loading="lazy">
      <figcaption><b>Welcome banner (first version)</b><br>Kept so that older links still work.<br><code>assets/v1/launchpad-welcome-banner.png</code></figcaption>
    </figure>
  </div>
</main>
</body>
</html>
